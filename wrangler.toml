name = "cf1-forum"
main = "dist/index.js"
compatibility_date = "2026-10-01"

# 一键部署时 Cloudflare 会自动创建 D1 并回填 database_id
# 手动部署时把下面改成你自己的 database_id
[[d1_databases]]
binding = "DB"
database_name = "forum-db"
database_id = "b8e4e340-5438-41cb-b732-843a4dbeed20"
migrations_dir = "migrations"

[vars]
TURNSTILE_SITE_KEY = "528355"
FROM_EMAIL = "noreply@example.com"
